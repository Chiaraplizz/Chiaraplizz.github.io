# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
first_name: Chiara
last_name: Plizzari
email: chiara.plizzari@unibocconi.it
description: >
  Chiara Plizzari, Assistant Professor at Bocconi University. Video understanding,
  egocentric vision and multimodal learning.
lang: en
icon: emoticon.png                                # favicon, in assets/img/
profile_image: MZB_Chiara-byMarionFregeac-1.jpg   # in assets/img/
cv_pdf: CurriculumVitae.pdf                       # in assets/pdf/

url: https://chiaraplizz.github.io
baseurl: ""

# Social links shown under the bio (leave empty to hide)
scholar_userid: OlK2hyIAAAAJ
github_username: Chiaraplizz
linkedin_username: chiara-plizzari
twitter_username: chiaraplizzari

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------
markdown: kramdown

include:
  - _pages

collections:
  news:
    output: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - teaser_1.png
  - what_can.png

keep_files:
  - CNAME
  - .nojekyll
  - .git

plugins:
  - jekyll/scholar
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Scholar (publications are read from _bibliography/papers.bib)
# -----------------------------------------------------------------------------
scholar:
  last_name: [Plizzari]
  first_name: [Chiara, C.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  sort_by: none   # keep the order of papers.bib (newest first)
  group_by: none

  query: "@*"

# Fields used only by the website; they are hidden from the displayed BibTeX
filtered_bibtex_keywords: [abbr, abstract, arxiv, award, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, project, dataset, category]
